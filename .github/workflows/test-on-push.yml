# Acknowledgements:
## https://anand-rohan.medium.com/using-pylint-for-python-code-analysis-in-github-actions-878b61639623
## https://github.com/actions/starter-workflows/blob/main/ci/pylint.yml
## https://docs.docker.com/build/ci/github-actions/local-registry/

name: Lint Build and Test

on: [push]

permissions:
  actions: read
  artifact-metadata: read
  attestations: read
  checks: read
  code-quality: read
  contents: read
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  security-events: read
  statuses: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    permissions:
        contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip==26.2 install --upgrade pip
        pip install --only-binary :all: --require-hashes -r requirements/app-requirements.txt
        pip install --only-binary :all: --require-hashes -r requirements/test-and-scan-requirements.txt
        pip install --only-binary :all: --require-hashes -r requirements/pylint-requirements.txt

    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
        contents: read

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.0.0
        with:
          dockerfile: Dockerfile
  
  docker:
    runs-on: ubuntu-latest
    permissions:
        contents: read
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver-opts: network=host
      
      - name: Build and push to local registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: localhost:5000/name/app:latest
      
      - name: Inspect
        run: |
          docker buildx imagetools inspect localhost:5000/name/app:latest

  run-pytest:
    runs-on: ubuntu-latest
    permissions:
        contents: read

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip==26.2 install --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements/app-requirements.txt
          pip install --only-binary :all: --require-hashes -r requirements/test-and-scan-requirements.txt

      - name: Test with pytest
        run: |
          pytest tests/
