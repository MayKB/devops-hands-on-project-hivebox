apiVersion: v1
kind: Namespace
metadata:
  name: hivebox-namespace
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hivebox-app
  name: hivebox-app
  namespace: hivebox-namespace
spec:
  ports:
  - name: http
    port: 5000
    protocol: TCP
    targetPort: 5000
  selector:
    app.kubernetes.io/name: hivebox-app
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hivebox-app
  name: hivebox-app
  namespace: hivebox-namespace
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hivebox-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivebox-app
    spec:
      containers:
      - env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: hivebox-config
        image: ghcr.io/maykb/hivebox-image:latest
        name: hivebox
      imagePullSecrets:
        - name: ghcr-secret
